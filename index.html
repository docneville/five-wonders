<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Five Wonders</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="fw.css" />
</head>

<body class="fw-home fw-bg">
  <header class="fw-header">
    <a href="index.html" class="fw-header-title">Five Wonders</a>
  </header>

  <div id="app">
    <main class="fw-home-main">
      <div class="fw-card">
        <div class="fw-logo-wrap">
          <img src="five-wonders-logo.png" alt="Five Wonders logo" class="fw-logo-img" />
        </div>

        <!-- Loading state -->
        <div id="stateLoading" class="fw-auth-state">
          <p class="fw-subtitle">Checking sign-in…</p>
        </div>

        <!-- Sign-in state -->
        <div id="stateSignIn" class="fw-auth-state" style="display:none;">
          <div class="fw-subtitle">Share the places your friends will love.</div>
          <div class="fw-btn-group-primary" style="margin-top:24px;">
            <button id="googleSignInBtn" class="fw-btn fw-btn-google fw-btn-large">
              <svg width="20" height="20" viewBox="0 0 48 48" style="margin-right:10px;flex-shrink:0;">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
              </svg>
              Sign in with Google
            </button>
          </div>
          <div class="fw-footer" style="margin-top:24px;">Invite-only beta · Curated by friends</div>
        </div>

        <!-- Pending state -->
        <div id="statePending" class="fw-auth-state" style="display:none;">
          <div id="pendingGreeting" class="fw-greeting"></div>
          <div class="fw-subtitle" style="margin-top:8px;">Your account is pending approval.</div>
          <p style="color:var(--fw-text-muted);font-size:0.9rem;margin-top:8px;text-align:center;">
            You'll receive access once an admin approves your request.
          </p>
          <div class="fw-btn-group-primary" style="margin-top:24px;">
            <button id="pendingSignOutBtn" class="fw-btn fw-btn-secondary">Sign out</button>
          </div>
        </div>

        <!-- Rejected/suspended state -->
        <div id="stateRejected" class="fw-auth-state" style="display:none;">
          <div class="fw-subtitle" style="color:#dc2626;">Access denied.</div>
          <p id="rejectedMsg" style="color:var(--fw-text-muted);font-size:0.9rem;margin-top:8px;text-align:center;"></p>
          <div class="fw-btn-group-primary" style="margin-top:24px;">
            <button id="rejectedSignOutBtn" class="fw-btn fw-btn-secondary">Sign out</button>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script>
    const SUPABASE_URL = "https://ekpssonwtztubqfihlqm.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVrcHNzb253dHp0dWJxZmlobHFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM1Njg2MjAsImV4cCI6MjA3OTE0NDYyMH0.R1_-ctf-6NsVUJEApf4N591lA9TPRCJQFzhrDVRbr_4";

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const stateLoading   = document.getElementById("stateLoading");
    const stateSignIn    = document.getElementById("stateSignIn");
    const statePending   = document.getElementById("statePending");
    const stateRejected  = document.getElementById("stateRejected");

    function showState(name) {
      [stateLoading, stateSignIn, statePending, stateRejected].forEach(el => el.style.display = "none");
      document.getElementById("state" + name).style.display = "block";
    }

    async function handleSession(session) {
      if (!session) { showState("SignIn"); return; }

      const userId = session.user.id;
      const meta = session.user.user_metadata ?? {};

      let { data: profile } = await sb
        .from("profiles")
        .select("first_name, approval_status")
        .eq("id", userId)
        .maybeSingle();

      // First-time Google sign-in: create profile row
      if (!profile) {
        await sb.from("profiles").insert({
          id: userId,
          first_name: meta.given_name ?? "",
          last_name: meta.family_name ?? "",
          approval_status: "pending",
          is_admin: false,
        });
        profile = { first_name: meta.given_name ?? "", approval_status: "pending" };
      }

      const status = profile?.approval_status ?? "pending";

      if (status === "approved") {
        window.location.replace("view.html");
        return;
      }

      if (status === "pending") {
        const name = (profile?.first_name || "").trim();
        document.getElementById("pendingGreeting").textContent = name ? `Hi, ${name}!` : "";
        document.getElementById("pendingGreeting").style.display = name ? "block" : "none";
        showState("Pending");
        return;
      }

      // rejected or suspended
      const msgs = {
        rejected: "Your access request was not approved.",
        suspended: "Your account has been suspended. Contact support for help.",
      };
      document.getElementById("rejectedMsg").textContent = msgs[status] ?? "Access denied.";
      showState("Rejected");
    }

    document.addEventListener("DOMContentLoaded", async () => {
      // Google sign-in
      document.getElementById("googleSignInBtn").addEventListener("click", async () => {
        await sb.auth.signInWithOAuth({
          provider: "google",
          options: { redirectTo: "https://fivewonders.app/index.html" },
        });
      });

      // Sign-out buttons
      async function signOut() {
        await sb.auth.signOut();
        showState("SignIn");
      }
      document.getElementById("pendingSignOutBtn").addEventListener("click", signOut);
      document.getElementById("rejectedSignOutBtn").addEventListener("click", signOut);

      // Check session on load (handles OAuth callback too)
      const { data: { session } } = await sb.auth.getSession();
      await handleSession(session);

      // Also listen for auth state changes (fires after OAuth redirect)
      sb.auth.onAuthStateChange(async (_event, session) => {
        await handleSession(session);
      });
    });
  </script>
</body>
</html>
